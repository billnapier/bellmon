[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bellmon"
version = "0.1.0"
description = "Bellmon (Bellarmine Monitor) - Academic & Workload Sentinel"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bellmon Team" }
]
dependencies = [
    "google-cloud-firestore>=2.11.0",
    "google-cloud-secret-manager>=2.16.0",
    "playwright>=1.38.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
